# Local development infrastructure only. Never holds real student data.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: campusverse
      POSTGRES_PASSWORD: campusverse
      POSTGRES_DB: campusverse
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql
      - ./packages/db/sql/roles.local.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campusverse']
      interval: 2s
      retries: 30

  redis:
    image: redis:7.2
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 30

  # Private S3 stand-in for documents. Development only.
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: campusverse-dev
    ports: ['9090:9090']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:9090/ >/dev/null 2>&1 || curl -sf http://localhost:9090/ >/dev/null',
        ]
      interval: 3s
      retries: 40

volumes:
  pgdata:
